<!doctype html><meta charset="utf-8"><title>clipforge showreel</title><link rel="icon" href="data:,">
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas id="c"></canvas>
<script type="module">
// Compositor (LEVELS.md): plays levels/<file>.js in timeline order, flies the camera through each exit door into the
// next level, puts the HUD on top. Scratch contract: window.frame(t), window.ready.
// ?only=N  — level N alone at local time t (still flies into level N+1 at its end); ?w=1920 — wide 16:9 world; ?nohud=1
import { SEGS, TOTAL, segAt } from './timeline.js';
const q = new URLSearchParams(location.search), W = +(q.get('w') || 1080), H = 1080, ONLY = q.has('only') ? +q.get('only') : null;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const A = mk(), Bc = mk(), S = { W, H, segs: SEGS };   // segs: the finale may draw other levels (segs[k].L.draw)

let hud = null; try { hud = (await import('./hud.js')).default; } catch (e) { console.warn('hud.js missing', e.message); }
const placeholder = g => ({ draw(c, t) { c.fillStyle = `hsl(${g.n * 37} 40% 22%)`; c.fillRect(0, 0, W, H); c.fillStyle = '#fff'; c.font = 'bold 90px monospace';
  c.textAlign = 'center'; c.fillText(g.title, W / 2, H / 2); c.font = '40px monospace'; c.fillText(`t=${t.toFixed(2)}`, W / 2, H / 2 + 80);
  c.fillStyle = '#D87754'; c.fillRect(120 + t * 120, 760, 160, 100); }, door: () => ({ x: W - 300, y: 560, w: 160, h: 300 }) });
for (const g of SEGS) {
  try { g.L = (await import(`./levels/${g.file}.js`)).default; } catch (e) { console.warn(g.file, e.message); g.L = placeholder(g); }
  if (g.L.init) await g.L.init({ ...S, seg: g });
}
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

window.frame = async gt => {
  const g = ONLY == null ? segAt(gt) : SEGS.find(s => s.n === ONLY), lt = ONLY == null ? gt - g.start : gt, i = SEGS.indexOf(g), nx = SEGS[i + 1];
  const a = A.getContext('2d'); a.save(); g.L.draw(a, lt, { ...S, seg: g }); a.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const tin = g.L.doorIn ?? g.doorIn;   // door flight start (a level may override doorIn)
  if (nx && g.L.door && lt >= tin) {
    const p = ease(Math.min(1, (lt - tin) / (g.dur - tin))), d = g.L.door(lt, { ...S, seg: g });
    const Z = Math.max(W / d.w, H / d.h) * 1.08, z = Math.pow(Z, p), dcx = d.x + d.w / 2, dcy = d.y + d.h / 2;
    const tx = dcx + (W / 2 - dcx) * p, ty = dcy + (H / 2 - dcy) * p;           // door centre glides to the frame centre
    const b = Bc.getContext('2d'); b.save(); nx.L.draw(b, 0, { ...S, seg: nx }); b.restore();
    ctx.save(); ctx.translate(tx, ty); ctx.scale(z, z); ctx.translate(-dcx, -dcy); ctx.drawImage(A, 0, 0);
    ctx.beginPath(); ctx.rect(d.x, d.y, d.w, d.h); ctx.restore(); ctx.save(); ctx.clip(); ctx.drawImage(Bc, 0, 0); ctx.restore();
  } else ctx.drawImage(A, 0, 0);
  if (hud && !q.has('nohud')) hud.draw(ctx, { gt, lt, seg: g, W, H, bossHp: g.L.bossHp ? g.L.bossHp(lt) : null, segs: SEGS });
};
window.TOTAL = TOTAL;
window.EVENTS = SEGS.flatMap(g => (g.L.events || []).map(e => ({ t: +(g.start + e.t).toFixed(4), k: e.k, n: g.n }))).sort((a, b) => a.t - b.t);   // for tools/build.sh (sound)
window.ready = true;
</script>
